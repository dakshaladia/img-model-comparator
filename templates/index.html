{% extends "base.html" %}

{% block content %}
<div class="mb-10">
    <h1 class="text-3xl font-bold mb-1">Sweep</h1>
    <p class="text-gray-400">Parameter exploration for generative image models.</p>
</div>

<div class="mb-6">
    <label for="model-select" class="block text-sm font-medium text-gray-300 mb-2">Model</label>
    <select
        id="model-select"
        name="slug"
        hx-get="/model-form"
        hx-target="#form-target"
        hx-trigger="change, load"
        hx-swap="innerHTML"
        class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-gray-100 focus:outline-none focus:border-blue-500"
    >
        {% for slug in model_slugs %}
        <option value="{{ slug }}">{{ models[slug] }} &mdash; {{ slug }}</option>
        {% endfor %}
    </select>
</div>

<div id="form-target"></div>

<div id="results-target" class="mt-6">
    <div class="flex items-center justify-center py-16 text-gray-600 text-sm">
        Run a sweep to see results here.
    </div>
</div>

<script>
    window.SWEEP_COSTS = {{ costs | tojson }};
</script>
{% endblock %}
