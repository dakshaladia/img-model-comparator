{% extends "base.html" %}

{% block content %}
<header class="mb-8">
    <h1 class="text-heading mb-0.5">Parameter sweep</h1>
    <p class="mono" style="font-size:11px;color:var(--ink-3);margin-bottom:4px">Up to two parameters can be swept per run (rows &times; columns).</p>
    <p id="model-readout" class="label-mono" style="color:var(--ink-4)"></p>
</header>

<div class="mb-5">
    <label class="label-mono block mb-1.5" style="color:var(--ink-4)">Model</label>
    <select
        id="model-select"
        name="slug"
        hx-get="/model-form"
        hx-target="#form-target"
        hx-trigger="change, load"
        hx-swap="innerHTML"
        class="field"
    >
        {% for slug in model_slugs %}
        <option value="{{ slug }}">{{ models[slug] }}</option>
        {% endfor %}
    </select>
    <p id="model-description" class="mono" style="font-size:10.5px;color:var(--ink-3);margin-top:4px"></p>
    <div class="mt-2">
        <label class="label-mono block mb-1.5" style="color:var(--ink-4);font-size:9.5px">Compare across models</label>
        <div id="model-compare" class="flex flex-wrap gap-1.5">
            {% for slug in model_slugs %}
            <button type="button" class="chip" data-model-chip="{{ slug }}"
                title="{{ descriptions[slug] }}"
                onclick="toggleModelCompare('{{ slug }}')">
                <span class="dot"></span>
                <span class="mono">{{ models[slug] }}</span>
            </button>
            {% endfor %}
        </div>
        <p id="model-compare-note" class="mono hidden" style="font-size:10px;color:var(--ink-4);margin-top:4px">Disable one parameter sweep to compare across models.</p>
    </div>
</div>

<div id="form-target"></div>

<div id="results-target" class="mt-8">
    <div class="flex items-center justify-center py-20" style="color:var(--ink-4)">
        <p class="label-mono">Run a sweep to see results</p>
    </div>
</div>

<script>
    window.SWEEP_COSTS = {{ costs | tojson }};
    window.MODEL_DESCRIPTIONS = {{ descriptions | tojson }};
    // Update slug readout and description when model changes
    function updateReadout() {
        var sel = document.getElementById('model-select');
        var readout = document.getElementById('model-readout');
        var desc = document.getElementById('model-description');
        if (sel && readout) readout.textContent = sel.value;
        if (sel && desc) desc.textContent = window.MODEL_DESCRIPTIONS[sel.value] || '';
    }
    document.addEventListener('change', function(e) {
        if (e.target.id === 'model-select') updateReadout();
    });
    document.addEventListener('DOMContentLoaded', updateReadout);
</script>
{% endblock %}
