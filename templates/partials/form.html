<form id="sweep-form" hx-post="/sweep" hx-target="#results-target" hx-swap="innerHTML" class="space-y-5">
    <input type="hidden" name="slug" value="{{ slug }}">
    <div id="compare-models-inputs"></div>

    {% for input in inputs %}
        {% include "partials/input_field.html" %}
    {% endfor %}

    <div class="flex items-center gap-3 pt-2">
        <button
            type="submit"
            hx-disabled-elt="this"
            class="btn btn-primary"
        >
            <span class="btn-label flex items-center gap-2">
                <svg width="10" height="12" viewBox="0 0 10 12" fill="currentColor"><polygon points="0,0 10,6 0,12"/></svg>
                Run
            </span>
            <span class="btn-loading hidden">
                <span class="spinner" style="width:14px;height:14px;border-width:2px;"></span>
                Running...
            </span>
        </button>
        <button type="button" class="btn btn-ghost" onclick="resetForm()">Reset</button>
        <p id="cost-preview" class="label-mono flex-1 text-right" style="color:var(--ink-4)"></p>
    </div>
</form>
