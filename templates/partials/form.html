<form id="sweep-form" hx-post="/sweep" hx-target="#results-target" hx-swap="innerHTML" class="space-y-5">
    <input type="hidden" name="slug" value="{{ slug }}">

    {% for input in inputs %}
        {% include "partials/input_field.html" %}
    {% endfor %}

    <button
        type="submit"
        hx-disabled-elt="this"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 disabled:cursor-wait text-white font-medium rounded-lg px-6 py-2.5 transition-colors"
    >
        <span class="btn-label">Run</span>
        <span class="btn-loading hidden">Running...</span>
    </button>

    <p id="cost-preview" class="text-xs text-gray-500 text-center"></p>
</form>
