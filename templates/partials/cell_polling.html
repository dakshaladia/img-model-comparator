<div id="cell-{{ gen.id }}" hx-get="/cell/{{ gen.id }}" hx-trigger="every 2s" hx-swap="outerHTML"
     class="bg-gray-900 border border-gray-700 rounded-lg overflow-hidden">
    {% if gen.label %}
    <p class="text-xs font-medium text-gray-400 px-3 pt-2">{{ gen.label }}</p>
    {% endif %}
    <div class="flex items-center justify-center aspect-square">
        <div class="text-center">
            <svg class="animate-spin h-6 w-6 text-gray-500 mx-auto mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <p class="text-xs text-gray-500">Generating...</p>
        </div>
    </div>
</div>
