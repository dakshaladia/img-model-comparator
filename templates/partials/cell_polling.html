<div id="cell-{{ gen.id }}" hx-get="/cell/{{ gen.id }}" hx-trigger="every 2s" hx-swap="outerHTML"
     class="frame stripes">
    {% if gen.label %}
    <span class="frame-label">{{ gen.label }}</span>
    {% endif %}
    <div class="flex items-center justify-center aspect-square">
        <div class="text-center">
            <div class="spinner mx-auto mb-2"></div>
            <p class="label-mono" style="color:var(--ink-3)">Generating</p>
        </div>
    </div>
</div>
