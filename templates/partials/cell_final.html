<div id="cell-{{ gen.id }}" class="bg-gray-900 border {{ 'border-red-500/50' if gen.status == 'failed' else 'border-gray-700' }} rounded-lg overflow-hidden">
    {% if gen.label %}
    <p class="text-xs font-medium text-gray-400 px-3 pt-2">{{ gen.label }}</p>
    {% endif %}

    {% if gen.status == "complete" %}
        <a href="{{ gen.output_url }}" target="_blank" class="block">
            <img src="{{ gen.output_url }}" alt="{{ gen.label }}" class="w-full aspect-square object-cover hover:opacity-90 transition-opacity">
        </a>
        <p class="text-xs text-gray-500 px-3 py-1.5">{{ "%.1f" | format(gen.generation_ms / 1000) }}s</p>
    {% else %}
        <div class="flex flex-col items-center justify-center aspect-square gap-2 px-4">
            <svg class="h-6 w-6 text-red-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
            </svg>
            <p class="text-xs text-red-400 text-center">{{ gen.error or "Generation failed" }}</p>
        </div>
    {% endif %}
</div>
