<div id="cell-{{ gen.id }}" class="frame {{ 'frame--failed' if gen.status == 'failed' else '' }}">
    {% if gen.label %}
    <span class="frame-label">{{ gen.label }}</span>
    {% endif %}

    {% if gen.status == "complete" %}
        <a href="{{ gen.output_url }}" target="_blank" class="block">
            <img src="{{ gen.output_url }}" alt="{{ gen.label }}">
        </a>
        <span class="frame-timing">{{ "%.1f" | format(gen.generation_ms / 1000) }}s</span>
    {% else %}
        <div class="flex flex-col items-center justify-center aspect-square gap-2 px-4">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <p class="label-mono" style="color:var(--danger)">Failed</p>
            <p class="mono text-center" style="font-size:11px;color:var(--ink-3)">{{ gen.error or "Generation failed" }}</p>
        </div>
    {% endif %}
</div>
